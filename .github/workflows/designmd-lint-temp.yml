name: DESIGN.md temporary validation
on:
  push:
    branches: [chatgpt/mobile-web-clone-build]
    paths:
      - '.chatgpt/T3-Code-DESIGN.md'
      - '.github/workflows/designmd-lint-temp.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint DESIGN.md
        run: npx -y @google/design.md@latest lint --format json .chatgpt/T3-Code-DESIGN.md
      - name: Export Tailwind v4 theme
        run: npx -y @google/design.md@latest export --format css-tailwind .chatgpt/T3-Code-DESIGN.md > /tmp/t3-theme.css
